<text x="450" y="22" text-anchor="middle" class="dim">oska run</text>
<text x="20" y="63" class="cmd" textLength="583.2" lengthAdjust="spacing">$ oska run --session demo --replay examples/ops/cassettes/restart-in-italian.json</text>
<rect id="e0" class="a m" x="20" y="48" width="585.2" height="20" fill="#0d1117"/>
<text x="20" y="83" class="typed" textLength="460.8" lengthAdjust="spacing">&gt; Il servizio search in staging è bloccato, riavvialo per favore</text>
<rect id="e1" class="a m" x="20" y="68" width="462.8" height="20" fill="#0d1117"/>
<text id="e2" x="20" y="103" class="out a">Questa operazione modifica qualcosa, quindi serve prima la tua approvazione.</text>
<text id="e3" x="20" y="123" class="out a">service.restart su integration.container_runtime con {"service":"search"}</text>
<text id="e4" x="20" y="143" class="out a">Rispondi sì per approvarla, oppure no per lasciare tutto com'è.</text>
<text id="e5" x="20" y="163" class="hold a">awaiting approval 79014991…</text>
<text id="e6" x="20" y="183" class="hold a">  integration.container_runtime service.restart {"service":"search"}</text>
<text id="e7" x="20" y="203" class="hold a">  approvals 0 of 1</text>
<text id="e8" x="20" y="223" class="dim a">read  integration.container_runtime service.status</text>
<text id="e9" x="20" y="243" class="hold a">approval_pending  integration.container_runtime service.restart</text>
<text x="20" y="263" class="typed" textLength="28.8" lengthAdjust="spacing">&gt; sì</text>
<rect id="e10" class="a m" x="20" y="248" width="30.8" height="20" fill="#0d1117"/>
<text id="e11" x="20" y="283" class="out a">Il riavvio del servizio search in staging è stato eseguito e verificato. Il servizio è ora in esecuzione con du…</text>
<text id="e12" x="20" y="303" class="out a">L'operazione service.restart è stata eseguita e la rilettura ha confermato … La ricevuta b01130ad… è verificata.</text>
<text id="e13" x="20" y="323" class="done a">receipt  integration.container_runtime service.restart  b01130ad…</text>
<text id="e14" x="20" y="343" class="dim a">read  integration.container_runtime service.status</text>
<text x="20" y="363" class="typed" textLength="460.8" lengthAdjust="spacing">&gt; Il servizio search in staging è bloccato, riavvialo per favore</text>
<rect id="e15" class="a m" x="20" y="348" width="462.8" height="20" fill="#0d1117"/>
<text id="e16" x="20" y="383" class="out a">Il riavvio del servizio search è stato eseguito e verificato. L'operazione è confermata con la ricevuta ec9a0a6…</text>
<text id="e17" x="20" y="403" class="out a">L'operazione service.restart era già stata eseguita in questa sessione, ricevuta b01130ad….</text>
<text id="e18" x="20" y="423" class="hit a">ledger_hit  integration.container_runtime service.restart  b01130ad…</text>
