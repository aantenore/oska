name: ci

on:
  push:
  pull_request:

jobs:
  build:
    # The package declares `requires-python >= 3.11`: every supported minor
    # version runs the whole job.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e '.[dev,api]'

      - name: Install the trace exporter for its tests
        run: pip install opentelemetry-sdk opentelemetry-exporter-otlp-proto-http

      - name: Lint
        run: ruff check src tests

      - name: Type check
        if: matrix.python-version == '3.12'
        run: mypy

      - name: Test
        run: pytest -q

      - name: Validate the catalog
        run: oska validate

      - name: Evaluate the operational catalog
        run: oska evaluate catalog --skills examples/ops/skills

      - name: Evaluate the access catalog
        run: oska evaluate catalog --skills examples/access/skills

      - name: Evaluate the data catalog
        run: oska evaluate catalog --skills examples/data/skills

      - name: Conform the operational catalog
        run: oska conform

      - name: Conform the access catalog
        run: >-
          oska conform
          --skills examples/access/skills
          --scenarios examples/access/scenarios
          --connectors examples/access/configs/connectors.json

      - name: Conform the data catalog
        run: >-
          oska conform
          --skills examples/data/skills
          --scenarios examples/data/scenarios
          --connectors examples/data/configs/connectors.json

  package:
    # The built wheel, installed the way an adopter installs it: into a fresh
    # virtual environment, and run from an empty directory outside the checkout,
    # so the defaults the package ships are what is used, not this repository's
    # `configs/`. Then the newcomer path, end to end.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the distributions
        run: |
          set -euo pipefail
          python -m pip install build
          python -m build

      - name: Check the distribution metadata
        run: |
          set -euo pipefail
          python -m pip install twine
          twine check dist/*

      - name: Install the wheel into a fresh environment
        run: |
          set -euo pipefail
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          python -m venv "$RUNNER_TEMP/adopter"
          "$RUNNER_TEMP/adopter/bin/python" -m pip install "$PWD/${wheels[0]}[api]"
          mkdir "$RUNNER_TEMP/workdir"

      - name: Run the newcomer path outside the checkout
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/workdir"
          export PATH="$RUNNER_TEMP/adopter/bin:$PATH"
          test "$(command -v oska)" = "$RUNNER_TEMP/adopter/bin/oska"
          oska --help
          oska new platform acme
          cd acme
          oska new pack billing --into packs
          oska pack check packs/billing
          oska conform --platform platform.yaml
          greeting="$(oska run --platform platform.yaml --session s1 --text "hello")"
          echo "$greeting"
          test -n "$greeting"
          grep -q "I can" <<< "$greeting"

  image:
    # The container image builds from a clean checkout and answers its health
    # check. Nothing is pushed anywhere.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build --tag oska:ci .

      - name: Start it and check health
        run: |
          set -euo pipefail
          docker run -d --name oska-ci -p 127.0.0.1:8000:8000 oska:ci
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs oska-ci
          exit 1

  postgres:
    # The relational backend against a live PostgreSQL 16, started as a service
    # container. Every suite runs twice in a row over the same database, so a
    # run that left anything behind would fail the second one.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oska
          POSTGRES_PASSWORD: oska-ci
          POSTGRES_DB: oska
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oska -d oska"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      OSKA_TEST_POSTGRES_URL: postgresql://oska:oska-ci@127.0.0.1:5432/oska
      OSKA_DATABASE_URL: postgresql://oska:oska-ci@127.0.0.1:5432/oska
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e '.[dev,postgres]'

      - name: Storage contract and conformance isolation (first run)
        run: >-
          pytest -q tests/unit/test_storage_contract.py
          tests/unit/test_storage_contract_shared.py
          tests/unit/test_conformance_postgres.py

      - name: Storage contract and conformance isolation (second run)
        run: >-
          pytest -q tests/unit/test_storage_contract.py
          tests/unit/test_storage_contract_shared.py
          tests/unit/test_conformance_postgres.py

      - name: Select the relational backend
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          document = json.loads(Path("configs/runtime.json").read_text(encoding="utf-8"))
          document["storage"].update(backend="postgres", url_env="OSKA_DATABASE_URL")
          target = Path(os.environ["RUNNER_TEMP"]) / "runtime.postgres.json"
          target.write_text(json.dumps(document, indent=2), encoding="utf-8")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"OSKA_RUNTIME_CONFIG={target}\n")
          PY

      - name: Conform the operational catalog (first run)
        run: oska conform

      - name: Conform the operational catalog (second run)
        run: oska conform

      - name: Conform the access catalog (first run)
        run: >-
          oska conform
          --skills examples/access/skills
          --scenarios examples/access/scenarios
          --connectors examples/access/configs/connectors.json

      - name: Conform the access catalog (second run)
        run: >-
          oska conform
          --skills examples/access/skills
          --scenarios examples/access/scenarios
          --connectors examples/access/configs/connectors.json

      - name: Conform the data catalog (first run)
        run: >-
          oska conform
          --skills examples/data/skills
          --scenarios examples/data/scenarios
          --connectors examples/data/configs/connectors.json

      - name: Conform the data catalog (second run)
        run: >-
          oska conform
          --skills examples/data/skills
          --scenarios examples/data/scenarios
          --connectors examples/data/configs/connectors.json

      - name: Conform the platform (first run)
        run: oska conform --platform examples/platform.yaml

      - name: Conform the platform (second run)
        run: oska conform --platform examples/platform.yaml

      - name: No conformance namespace is left behind
        run: |
          python - <<'PY'
          import os

          import psycopg

          with psycopg.connect(os.environ["OSKA_DATABASE_URL"]) as connection:
              for table in ("oska_sessions", "oska_receipts", "oska_write_claims"):
                  left = connection.execute(
                      f"SELECT COUNT(*) FROM {table} WHERE namespace LIKE 'conformance/%'"
                  ).fetchone()[0]
                  print(f"{table}: {left} row(s) in conformance namespaces")
                  assert left == 0, f"{table} still holds {left} conformance row(s)"
          PY
