[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oska"
version = "0.1.0"
description = "Governed execution of declared operational procedures."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Antonio Antenore" }]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "jsonschema>=4.21",
    "typer>=0.12",
]

[project.optional-dependencies]
api = ["fastapi>=0.111", "uvicorn>=0.30"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
oska = "oska.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
