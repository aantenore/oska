[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "oska"
version = "0.1.0"
description = "A standard and a runtime for governed agentic systems on enterprise systems."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Antonio Antenore" }]
keywords = [
    "agents",
    "agentic",
    "governance",
    "ontology",
    "llm",
    "workflow",
    "approvals",
    "conformance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "jsonschema>=4.21",
    "typer>=0.12",
]

[project.optional-dependencies]
api = ["fastapi>=0.111", "uvicorn>=0.30"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/aantenore/oska"
Repository = "https://github.com/aantenore/oska"
Documentation = "https://github.com/aantenore/oska/tree/main/docs"
Changelog = "https://github.com/aantenore/oska/blob/main/CHANGELOG.md"
Issues = "https://github.com/aantenore/oska/issues"

[project.scripts]
oska = "oska.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oska = [
    "py.typed",
    "templates/**/*",
    "templates/**/.*",
    "templates/**/.*/**/*",
    "defaults/**/*",
    "defaults/**/.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
