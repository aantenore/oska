name: conformance

on:
  push:
  pull_request:

jobs:
  conform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install oska
        # The version that generated this platform. Until that version is on the
        # package index, it is installed from its source repository instead.
        # Set the repository variable OSKA_INSTALL to install from anywhere else.
        env:
          OSKA_INSTALL: ${{ vars.OSKA_INSTALL }}
          OSKA_PINNED: oska==${oska_version}
          OSKA_SOURCE: oska @ git+${oska_repository}
        run: |
          if [ -n "$OSKA_INSTALL" ]; then
            pip install "$OSKA_INSTALL"
          elif ! pip install "$OSKA_PINNED"; then
            echo "::warning::$OSKA_PINNED is not on the package index; installing from source"
            pip install "$OSKA_SOURCE"
          fi
      - name: check every pack in isolation
        run: |
          set -e
          for pack in packs/*/; do
            echo "checking ${pack%/}"
            oska pack check "${pack%/}"
          done
      - name: check the platform as a whole
        run: oska conform --platform platform.yaml
